name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history for leaked secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose --exit-code 1

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install google-genai
      - name: CLI parses and fails cleanly without a key
        run: |
          python scripts/gemini.py --help
          python scripts/gemini.py ask -h
          set +e
          env -u GEMINI_API_KEY -u GOOGLE_API_KEY HOME=/tmp/nohome python scripts/gemini.py ask "hi"
          code=$?
          set -e
          test "$code" = "2"
